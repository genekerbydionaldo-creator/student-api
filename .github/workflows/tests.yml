name: API Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql

      - name: Create database and table
        run: mysql -h 127.0.0.1 -u root < database.sql

      - name: Import students_25.json
        run: php import_students.php

      - name: Start API server
        run: |
          php -S 127.0.0.1:8000 > server.log 2>&1 &
          sleep 3

      - name: Run API tests (PASS/FAIL)
        run: php test_api.php
